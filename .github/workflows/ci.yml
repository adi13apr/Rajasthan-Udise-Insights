# On every push and pull request: install, run the tests, run the whole pipeline on
# synthetic sample data. No real UDISE+ data is used (portal terms: no redistribution).
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -v
      - name: Pipeline on synthetic sample data
        run: python run_pipeline.py --sample --delta
      - name: Upload sample reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sample-reports
          path: data/sample/reports/

  # PySpark implementation (spark/): its tests and the parity check against the DuckDB
  # pipeline, on the synthetic sample only. Separate job so the main job needs no Java or Spark.
  spark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies (main + pyspark)
        run: pip install -r requirements-spark.txt
      - name: Spark tests
        run: python -m pytest tests/test_spark.py -v
      - name: Pipeline on synthetic sample data (DuckDB)
        run: python run_pipeline.py --sample
      - name: Parity PySpark vs DuckDB on the sample
        run: python -m spark.parity --sample
      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spark-parity-sample
          path: data/sample/reports/spark_parity.*

  # RAG (rag/): document ingestion (chunking, PDF extraction, the ChromaDB index) on synthetic
  # documents with a fake embedder, and the safe SQL tool on the synthetic sample gold database
  # (tests needing the full gold database skip). Installs only chromadb, reportlab and sqlglot
  # (pinned in requirements-rag.txt), not sentence-transformers/torch, and runs offline from
  # Hugging Face, so CI never downloads a model.
  rag:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies (main + chromadb + reportlab + sqlglot)
        run: |
          pip install -r requirements.txt
          pip install $(grep -E '^(chromadb|reportlab|sqlglot)==' requirements-rag.txt | cut -d' ' -f1)
      - name: RAG tests
        run: python -m pytest tests/test_rag_chunking.py tests/test_rag_pdf.py tests/test_rag_ingest.py tests/test_rag_sql.py -v -rs
